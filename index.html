<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorPro - Gestión de Peluquería & Barbería</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-teal-50 via-slate-50 to-indigo-50 text-slate-800 font-sans antialiased min-h-screen pb-24">

    <!-- HEADER / NAVEGACIÓN SUPERIOR -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="switchTab('dashboard')">
                <i class="fa-solid fa-scissors text-teal-400 text-xl"></i>
                <span class="font-bold text-lg tracking-wide">GestorPro</span>
            </div>
            <div class="flex items-center space-x-3">
                <span class="text-xs bg-teal-500/20 text-teal-300 px-2.5 py-1 rounded-full font-medium border border-teal-500/30">
                    Modo Pro
                </span>
                <button onclick="switchTab('dashboard')" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 rounded-full flex items-center justify-center text-slate-300 transition cursor-pointer" title="Ir al Menú Principal">
                    <i class="fa-solid fa-house text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- ================= MÓDULO 1: DASHBOARD (CUADRICULA DE ICONOS) ================= -->
        <section id="tab-dashboard" class="tab-content space-y-6">
            <div class="text-center mb-6">
                <h2 class="text-xl font-black text-slate-900 tracking-tight">Menú Principal</h2>
                <p class="text-xs text-slate-500 mt-1">Selecciona una opción para gestionar tu salón</p>
            </div>

            <!-- Cuadrícula 3x3 -->
            <div class="grid grid-cols-3 gap-3 md:gap-6">
                <button onclick="switchTab('agenda')" class="bg-white/90 backdrop-blur-md p-4 md:p-6 rounded-3xl shadow-sm hover:shadow-md border border-slate-100 transition flex flex-col items-center text-center group cursor-pointer">
                    <div class="w-14 h-14 md:w-16 md:h-16 bg-teal-50 text-teal-600 rounded-2xl flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition duration-300">
                        <i class="fa-solid fa-calendar-days"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700">Horario</span>
                </button>

                <button onclick="switchTab('clientes')" class="bg-white/90 backdrop-blur-md p-4 md:p-6 rounded-3xl shadow-sm hover:shadow-md border border-slate-100 transition flex flex-col items-center text-center group cursor-pointer">
                    <div class="w-14 h-14 md:w-16 md:h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition duration-300">
                        <i class="fa-solid fa-address-book"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700">Cliente</span>
                </button>

                <button onclick="switchTab('caja')" class="bg-white/90 backdrop-blur-md p-4 md:p-6 rounded-3xl shadow-sm hover:shadow-md border border-slate-100 transition flex flex-col items-center text-center group cursor-pointer">
                    <div class="w-14 h-14 md:w-16 md:h-16 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition duration-300">
                        <i class="fa-solid fa-cash-register"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700">Finalizar compra</span>
                </button>

                <button onclick="switchTab('catalogo')" class="bg-white/90 backdrop-blur-md p-4 md:p-6 rounded-3xl shadow-sm hover:shadow-md border border-slate-100 transition flex flex-col items-center text-center group cursor-pointer">
                    <div class="w-14 h-14 md:w-16 md:h-16 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition duration-300">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700">Catálogo</span>
                </button>

                <button onclick="switchTab('estadisticas')" class="bg-white/90 backdrop-blur-md p-4 md:p-6 rounded-3xl shadow-sm hover:shadow-md border border-slate-100 transition flex flex-col items-center text-center group cursor-pointer">
                    <div class="w-14 h-14 md:w-16 md:h-16 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition duration-300">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700">Estadísticas</span>
                </button>

                <button onclick="switchTab('marketing')" class="bg-white/90 backdrop-blur-md p-4 md:p-6 rounded-3xl shadow-sm hover:shadow-md border border-slate-100 transition flex flex-col items-center text-center group cursor-pointer">
                    <div class="w-14 h-14 md:w-16 md:h-16 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition duration-300">
                        <i class="fa-solid fa-bullhorn"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700">Marketing</span>
                </button>

                <button onclick="switchTab('informes')" class="bg-white/90 backdrop-blur-md p-4 md:p-6 rounded-3xl shadow-sm hover:shadow-md border border-slate-100 transition flex flex-col items-center text-center group cursor-pointer">
                    <div class="w-14 h-14 md:w-16 md:h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition duration-300">
                        <i class="fa-solid fa-file-invoice"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700">Informe</span>
                </button>

                <button onclick="switchTab('finanzas')" class="bg-white/90 backdrop-blur-md p-4 md:p-6 rounded-3xl shadow-sm hover:shadow-md border border-slate-100 transition flex flex-col items-center text-center group cursor-pointer">
                    <div class="w-14 h-14 md:w-16 md:h-16 bg-cyan-50 text-cyan-600 rounded-2xl flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition duration-300">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700">Contabilidad</span>
                </button>

                <button onclick="switchTab('ajustes')" class="bg-white/90 backdrop-blur-md p-4 md:p-6 rounded-3xl shadow-sm hover:shadow-md border border-slate-100 transition flex flex-col items-center text-center group cursor-pointer">
                    <div class="w-14 h-14 md:w-16 md:h-16 bg-slate-100 text-slate-600 rounded-2xl flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition duration-300">
                        <i class="fa-solid fa-gear"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700">Ajustes</span>
                </button>
            </div>
        </section>

        <!-- ================= MÓDULO 2: HORARIO / AGENDA AVANZADA ================= -->
        <section id="tab-agenda" class="tab-content hidden space-y-4">
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-center gap-3">
                <div class="flex items-center space-x-3 w-full md:w-auto justify-between">
                    <h3 class="font-bold text-slate-900 text-base">📅 03-11-2026</h3>
                    <button onclick="switchTab('dashboard')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer">Menú</button>
                </div>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 text-center">
                <p class="text-sm font-semibold text-slate-700">Módulo de Agenda y Horario Activo</p>
            </div>
        </section>

        <!-- ================= MÓDULO 3: CLIENTES ================= -->
        <section id="tab-clientes" class="tab-content hidden space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-900">Fichas de Clientes</h3>
                <button onclick="switchTab('dashboard')" class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer">Volver</button>
            </div>
        </section>

        <!-- ================= MÓDULO 4: CAJA / TPV ================= -->
        <section id="tab-caja" class="tab-content hidden space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-900">Finalizar Compra / TPV</h3>
                <button onclick="switchTab('dashboard')" class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer">Volver</button>
            </div>
        </section>

        <!-- ================= MÓDULO 5: CATÁLOGO ================= -->
        <section id="tab-catalogo" class="tab-content hidden space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-900">Catálogo de Servicios</h3>
                <button onclick="switchTab('dashboard')" class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer">Volver</button>
            </div>
        </section>

        <!-- ================= MÓDULO 6: ESTADÍSTICAS ================= -->
        <section id="tab-estadisticas" class="tab-content hidden space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-900">Estadísticas</h3>
                <button onclick="switchTab('dashboard')" class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer">Volver</button>
            </div>
        </section>

        <!-- ================= MÓDULO 7: MARKETING ================= -->
        <section id="tab-marketing" class="tab-content hidden space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-900">Marketing</h3>
                <button onclick="switchTab('dashboard')" class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer">Volver</button>
            </div>
        </section>

        <!-- ================= MÓDULO 8: INFORMES ================= -->
        <section id="tab-informes" class="tab-content hidden space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-900">Informes</h3>
                <button onclick="switchTab('dashboard')" class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer">Volver</button>
            </div>
        </section>

        <!-- ================= MÓDULO 9: CONTABILIDAD Y GASTOS FIJOS ================= -->
        <section id="tab-finanzas" class="tab-content hidden space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-900">Contabilidad & Gastos Fijos</h3>
                <button onclick="switchTab('dashboard')" class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer">Volver</button>
            </div>
        </section>

        <!-- ================= MÓDULO 10: AJUSTES ================= -->
        <section id="tab-ajustes" class="tab-content hidden space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-900">Ajustes del Sistema</h3>
                <button onclick="switchTab('dashboard')" class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer">Volver</button>
            </div>
        </section>

    </main>

    <!-- SCRIPT DE NAVEGACIÓN CORREGIDO -->
    <script>
        function switchTab(tabId) {
            // Ocultar todas las pestañas
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.add('hidden');
            });
            // Mostrar la pestaña seleccionada
            const target = document.getElementById('tab-' + tabId);
            if (target) {
                target.classList.remove('hidden');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
